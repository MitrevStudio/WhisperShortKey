name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ matrix.configuration }} --no-restore

      - name: Test (placeholder)
        run: dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal || exit 0

      - name: Publish
        run: dotnet publish -c ${{ matrix.configuration }} -o publish -p:PublishSingleFile=true -p:SelfContained=false -p:PublishReadyToRun=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whispershortkey-${{ matrix.configuration }}
          path: publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whispershortkey-Release
          path: publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/VoiceTray.exe
          generate_release_notes: true
